name: Continuous Patent Ingestion Pipeline

on:
  schedule:
    # Run weekly on Sundays at midnight (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  ingest-patents:
    name: Ingest US & BR Agricultural Patents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up uv (Fast Python Package Installer)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Ingestion Dependencies
        run: |
          uv pip install --system -r backend/requirements-ingestion.txt

      - name: Execute Continuous Ingestion to Snowflake
        env:
          PYTHONPATH: backend
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'FORMULA_APP_WH' }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'FORMULA_KNOWLEDGE_DB' }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA || 'GLOBAL_PATENTS' }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'ACCOUNTADMIN' }}
          LENS_API_KEY: ${{ secrets.LENS_API_KEY }}
        run: |
          python backend/ingestion/patents.py
